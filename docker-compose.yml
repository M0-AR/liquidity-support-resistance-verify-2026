services:
  research:
    build: .
    container_name: liq-sr-research
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
      - ./results:/workspace/results
    working_dir: /workspace
    command: python3 src/run_all.py
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_SOURCE=coinbase+binance-vision
      - TZ=UTC

  lab:
    build: .
    container_name: liq-sr-lab
    volumes:
      - ./:/workspace
    working_dir: /workspace
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    profiles: ["lab"]
